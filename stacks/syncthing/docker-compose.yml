---
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest #mudar para uma versão fixa depois
    container_name: syncthing
    hostname: syncthing #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - /opt/syncthing/config:/config
      - /mnt/dados/syncthing/data1:/data1
      - /mnt/dados/syncthing/data2:/data2
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
    restart: unless-stopped
    networks:
      - proxy

networks:
      proxy:
        external: true
